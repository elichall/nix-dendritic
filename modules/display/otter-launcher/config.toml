[general]
default_module = "@DEFAULT_MODULE@"
empty_module = "@DEFAULT_MODULE@"
exec_cmd = "sh -c"
vi_mode = false
esc_to_abort = true
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
clear_screen_after_execution = false
loop_mode = false
external_editor = "nvim"
delay_startup = 0
callback = ""


[interface]
header = """
  ┌ \u001B[34m$USER@$(hostname) \u001B[0m───┐
  │ \u001B[90m󰧑  \u001B[31m  \u001B[32m  \u001B[33m󰯙  \u001B[34m󰓥  \u001B[35m  \u001B[36m  \u001B[37m \u001B[0m│
  └ \u001B[90m󰀝  \u001B[31m󰳶  \u001B[32m  \u001B[33m  \u001B[34m󰣇  \u001B[35m  \u001B[36m  \u001B[37m \u001B[0m┘
  ┌ \u001B[36m󱄅 \u001B[1;36m system\u001B[0m $(printf "%12s" "NixOS") ┐
  │ \u001B[33m \u001B[1;36m window\u001B[0m $(printf "%12s" "$XDG_CURRENT_DESKTOP") │
  │ \u001B[31m \u001B[1;36m kernel\u001B[0m $(printf "%12s" "$(uname -r)") │
  │ \u001B[32m \u001B[1;36m uptime\u001B[0m $(printf "%12s" $(uptime | awk -F',|up' '{print $2}' | xargs) ) │
  │ \u001B[90m \u001B[0m """
header_cmd_trimmed_lines = 0
place_holder = "type & search"
suggestion_mode = "list"
separator = ""
footer = ""
suggestion_lines = 1
list_prefix = "  └ \u001B[34m  "
selection_prefix = "  └ \u001B[34m  "
prefix_padding = 3
default_module_message = "@DEFAULT_MODULE_MESSAGE@"
empty_module_message = "@DEFAULT_MODULE_MESSAGE@"
customized_list_order = false
indicator_with_arg_module = ""
indicator_no_arg_module = ""
prefix_color = "\u001B[33m"
description_color = "\u001B[39m"
place_holder_color = "\u001B[38m"
hint_color = "\u001B[90m"
cursor_shape = 0
move_interface_right = 0
move_interface_down = 1

[overlay]
# @OVERLAY_IMAGE@ is substituted by otter.nix mkOtterConfig at build time
# (repo-tracked modules/_assets/aesthetics/nixos-image.png).
overlay_cmd = "chafa -f symbols -s x8 @OVERLAY_IMAGE@"
overlay_trimmed_lines = 0
overlay_height = 0
move_overlay_right = 29
move_overlay_down = 1


[[modules]]
description = " launch apps"
prefix = "app"
with_argument = true
unbind_proc = false
cmd = "otter-apps --preview {}"

[[modules]]
description = "󰏖 nix search packages"
prefix = "nsp"
with_argument = true
url_encode = true
unbind_proc = false
cmd = """
RAW_BROWSER=$(xdg-settings get default-web-browser)
CLEAN_CLASS="${RAW_BROWSER%.desktop}"
xdg-open 'https://search.nixos.org/packages?channel=26.05&query={}' >/dev/null 2>&1
hyprctl dispatch "hl.dsp.focus({ window = 'class:${CLEAN_CLASS}' })" >/dev/null 2>&1
"""

[[modules]]
description = " nixos edit"
prefix = "ned"
with_argument = true
unbind_proc = false
cmd = '''
FILE_RELATIVE=$(find "$HOME/.nix" \
  \( -path "$HOME/.nix/legacy" -o -path "$HOME/.nix/.git" \) -prune -o \
  -type f \
  ! -name "*.png" ! -name "*.svg" ! -name "*.jpg" \
  -printf "%P\n" 2>/dev/null | \
  fzf \
  -q '{}' -1 \
  --info-command 'printf "files ($FZF_POS/$FZF_TOTAL_COUNT)"' \
  --cycle \
  --color "info:8,separator:8" \
  --prompt '   >> ' )

[ -n "$FILE_RELATIVE" ] && setsid -f @TERMINAL@ @CLASS_FLAG@com.special.window -e bash -c "cd \"$HOME/.nix\" && nvim \"$FILE_RELATIVE\""
'''

[[modules]]
description = " nix rebuild"
prefix = "nrb"
unbind_proc = false
cmd = """
setsid -f @TERMINAL@ @CLASS_FLAG@com.special.window -e bash -c '
sudo nixos-rebuild switch --flake "$HOME/.nix#workstation"
status=$?
if [ "$status" -eq 0 ]; then
  @NOTIFY_CMD@ success "nixos-rebuild succeeded"
  exit 0
else
  @NOTIFY_CMD@ error "nixos-rebuild FAILED (exit $status)"
  echo
  echo "Build failed - Press Enter to close..."
  read
fi' >/dev/null 2>&1
"""

[[modules]]
description = " nix shell"
prefix = "nsh"
with_argument = true
unbind_proc = false
cmd = """
setsid -f @TERMINAL@ @CLASS_FLAG@com.waybar.tui -e bash -c 'nix-shell -p {}; echo; echo "Press Enter to close..."; read' >/dev/null 2>&1
"""

[[modules]]
description = " google search"
prefix = "gg"
with_argument = true
url_encode = true
unbind_proc = false
cmd = """
RAW_BROWSER=$(xdg-settings get default-web-browser)
CLEAN_CLASS="${RAW_BROWSER%.desktop}"
xdg-open 'https://www.google.com/search?q={}' >/dev/null 2>&1
hyprctl dispatch "hl.dsp.focus({ window = 'class:${CLEAN_CLASS}' })" >/dev/null 2>&1
"""

[[modules]]
description = " open project (tmux)"
prefix = "pro"
with_argument = true
unbind_proc = false
cmd = """
project_name=$(ls -1 ~/Projects | fzf \
-q '{}' -1 \
--info-command 'printf "projects ($FZF_POS/$FZF_TOTAL_COUNT)"' \
--cycle \
--color "info:8,separator:8" \
--prompt '  󰉋 >> ' )
[ -n "$project_name" ] && setsid -f @TERMINAL@ -e tmux new-session -A -s "$project_name" -c "$HOME/Projects/$project_name"
"""

[[modules]]
description = " power menu"
prefix = "pow"
with_argument = true
cmd = """
safe() { setsid -f "$@" >/dev/null 2>&1; }
function power {
if [[ -n $1 ]]; then
case $1 in
*"logout") session=$(loginctl session-status | awk 'NR==1{print $1}'); safe loginctl terminate-session "$session" ;;
*"suspend") safe systemctl suspend ;;
*"hibernate") safe systemctl hibernate ;;
*"reboot") safe systemctl reboot ;;
*"shutdown") safe systemctl poweroff ;;
esac fi }
power "$(echo -e '  shutdown\\n󰜉  reboot\\n󰍃  logout\\n󰤄  suspend\\n󰒲  hibernate' | fzf \
-q '{}' -1 \
--cycle \
--info-command 'printf "power menu ($FZF_POS/$FZF_TOTAL_COUNT)"' \
--color "info:8,separator:8" \
--prompt '   >> ' | tail -1)"
"""

[[modules]]
description = "󰒋 ssh connect"
prefix = "ssh"
with_argument = true
unbind_proc = false
cmd = """
raw_host=$( (awk '/^Host[ \t]+[^*]/ {print $2}' ~/.ssh/config 2>/dev/null; tailscale status 2>/dev/null | awk '/^100\\./ {print $2}') | sort -u | fzf \
-q '{}' -1 \
--info-command 'printf "ssh ($FZF_POS/$FZF_TOTAL_COUNT)"' \
--cycle  \
--prompt '  󰒋 >> ' \
--color "info:8,separator:8" )

host=$(echo "$raw_host" | xargs)

if [ -n "$host" ]; then
    printf "    Username (Enter for default): "
    read user
    
    user=$(echo "$user" | xargs)
    target="${user:+$user@}$host"
    
    session_name=$(echo "$host" | tr '.' '_')
    
    setsid -f @TERMINAL@ -e bash -c "@TERMINAL@ -e bash -c 'ssh $target; exec bash'"
fi
"""

[[modules]]
description = "󰆍 tmux session manager"
prefix = "tsm"
with_argument = true
unbind_proc = false
cmd = """
A="{}"
set -f
set -- $A
action_q="${1:-}"
session_q="${2:-}"

action=$(printf 'switch\nnew\nrename\ndetach\nkill\n[cancel]' | fzf \
-q "$action_q" -1 \
--info-command 'printf "tsm action ($FZF_POS/$FZF_TOTAL_COUNT)"' \
--cycle \
--color "info:8,separator:8" \
--prompt '  󰆍 >> ' )

[ -z "$action" ] && exit 0
[ "$action" = "[cancel]" ] && exit 0

case "$action" in
  new)
    name="$session_q"
    if [ -z "$name" ]; then
      printf '  󰆍 New session name: '
      read name
    fi
    name=$(echo "$name" | xargs)
    [ -n "$name" ] && {
      tmux new-session -d -s "$name"
      setsid -f @TERMINAL@ -e tmux new-session -A -s "$name"
    }
    ;;
  *)
    multi=""
    { [ "$action" = "detach" ] || [ "$action" = "kill" ]; } && multi="--multi"
    target=$(tmux list-sessions -F '#{session_name}' 2>/dev/null | fzf $multi -q "$session_q" -1 \
    --info-command 'printf "sessions ($FZF_POS/$FZF_TOTAL_COUNT)"' \
    --cycle \
    --color "info:8,separator:8" \
    --prompt '  󰆍 >> ' \
    --preview 'tmux list-windows -t {1} -F "#{window_index}: #{window_name}#{?window_active,  (active),}" 2>/dev/null' \
    --preview-window=right:50%,wrap )
    [ -z "$target" ] && exit 0
    case "$action" in
      switch) setsid -f @TERMINAL@ -e tmux new-session -A -s "$target" ;;
      rename)
        printf '  󰆍 Rename "%s" to: ' "$target"
        read newname
        newname=$(echo "$newname" | xargs)
        [ -n "$newname" ] && tmux rename-session -t "$target" "$newname"
        ;;
      detach) printf '%s\n' "$target" | while read -r s; do tmux detach -s "$s"; done ;;
      kill) printf '%s\n' "$target" | sort -r | while read -r s; do tmux kill-session -t "$s"; done ;;
    esac
    ;;
esac
"""

[[modules]]
description = "󰏘 theme engine switch"
prefix = "th"
with_argument = true
unbind_proc = false
cmd = """
THEME=$( theme list --pure | fzf \
-q '{}' -1 \
--info-command 'printf "themes ($FZF_POS/$FZF_TOTAL_COUNT)"' \
--cycle \
--color "bg+:-1,pointer:1,info:8,separator:8,scrollbar:0" \
--prompt '  󰏘 >> ' \
--preview 'printf "\\033_Ga=d,d=A\\033\\\\"; CL=${FZF_PREVIEW_COLUMNS:-34}; LN=${FZF_PREVIEW_LINES:-15}; LN=$((LN-3)); [ "$LN" -lt 4 ] && LN=4; P=@THEME_DIR@/profiles/{1}.json; W=$(jq -r .wallpaper "$P" 2>/dev/null); S=@THEME_SWATCHES@/{1}.swatch; if [ -n "$W" ] && [ -f "$W" ]; then chafa -s "${CL}x${LN}" "$W"; i=0; while [ "$i" -lt "$LN" ]; do echo; i=$((i+1)); done; fi; if [ -f "$S" ]; then cat "$S"; else echo "  (no palette swatch)"; fi' \
--preview-window=right:50%,wrap )
theme switch $THEME
"""

[[modules]]
description = " calculator"
prefix = "calc"
with_argument = true
unbind_proc = false
cmd = """
input="{}"
if [ -n "$input" ]; then
    result=$(qalc -t "$input")
    printf "%s" "$result" | wl-copy
else
    qalc
fi
"""

